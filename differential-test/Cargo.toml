[package]
name = "ckb-vm-diff-test"
version = "0.1.0"
edition = "2021"
authors = ["TinyuengKwan <kwantinyueng@gmail.com>"]
description = "Differential testing framework: CKB-VM vs Sail RISC-V emulator"
license = "MIT"

[[bin]]
name = "ckb-vm-diff-test"
path = "src/main.rs"

[dependencies]
ckb-vm = { git = "https://github.com/nervosnetwork/ckb-vm", branch = "develop", features = ["detect-asm"] }
ckb-vm-definitions = { git = "https://github.com/nervosnetwork/ckb-vm", branch = "develop" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
