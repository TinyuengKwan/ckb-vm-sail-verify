[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["deps/ckb-vm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["TinyuengKwan <kwantinyueng@gmail.com>"]

[workspace.dependencies]
# The parent repository's submodule gitlink pins the exact production source
# revision used by both runtime tests and proof extraction.
ckb-vm = { path = "deps/ckb-vm" }
ckb-vm-sail-core = { path = "crates/core" }
ckb-vm-sail-ckb-runner = { path = "crates/ckb-runner" }
ckb-vm-sail-riscv-runner = { path = "crates/sail-runner" }
ckb-vm-sail-extract = { path = "crates/proof-extract" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
